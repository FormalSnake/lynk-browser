<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Foreground layer for the layered app icon: the framework's pipeline
       supplies the glass body and the background gradient, so this is art only.
       Content stays inside the 824px safe square Apple's icon grid reserves. -->
  <g transform="translate(512 512)">
    <circle r="300" fill="none" stroke="#ffffff" stroke-width="34" opacity="0.92" />
    <g transform="rotate(-38)">
      <!-- The needle reads as one shape at 16px: a solid north half and a
           translucent south half, so the direction survives the smallest size. -->
      <path d="M0 -232 L104 0 L0 92 L-104 0 Z" fill="#ffffff" />
      <path d="M0 232 L104 0 L0 92 L-104 0 Z" fill="#ffffff" opacity="0.45" />
    </g>
    <circle r="30" fill="#ffffff" />
  </g>
</svg>
