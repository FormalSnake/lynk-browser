[workspace]
resolver = "3"
members = ["crates/lynk"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# NativeDesktop is a path dependency until it is published: the checkout of its `browser`
# branch beside this repo (nd main plus the gaps this port finds). nd carries its own patched
# GPUI, which only reaches this workspace through the patch table below.
[patch.crates-io]
gpui-pre = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-pre" }
gpui-fast = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-fast" }
gpui-pre-linux = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-pre-linux" }
gpui-fast-linux = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-fast-linux" }
gpui-pre-wgpu = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-pre-wgpu" }
gpui-fast-wgpu = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-fast-wgpu" }
gpui-pre-windows = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-pre-windows" }
gpui-fast-windows = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-fast-windows" }
gpui-pre-apple = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-pre-apple" }
gpui-fast-apple = { path = "../nativedesktop-wt-browser/crates/nd-gpui/vendor/gpui-fast-apple" }

