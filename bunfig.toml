# Pin the classic hoisted layout so the app's `bun install` never flips to
# Bun 1.3+'s isolated (pnpm-style) linker. See the root bunfig.toml in the
# NativeDesktop repo for why that default is unsafe here: it can leave a
# `file:`/`link:`-referenced package (e.g. a local @nativedesktop/solid
# checkout during framework development) without its own transitive deps on
# disk, and the host's Bun child can't resolve them.
[install]
linker = "hoisted"

# A packaged bundle under dist/ carries compiled copies of the test files but
# not the fixtures they serve, so a bare `bun test` after `nd package` reports
# failures that exist nowhere in the source tree. The register preload gives a
# test that imports a component the Solid JSX transform and solid-js's client
# build, as `nd dev` does.
[test]
root = "src"
preload = ["@nativedesktop/solid/register"]
