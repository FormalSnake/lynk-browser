<!doctype html>
<!--
  A stand-in for a chromewebstore.google.com listing, for `webstore.test.ts`.

  It is not a copy of the store's page, and it is not trying to be. What it
  reproduces is the four things the hook actually reads: the accessible name on
  the install control, the store's own scripting-hook attributes, the listing
  container the control sits in, and enough neighbouring controls to prove the
  match is not "the first button on the page". The live store is unreachable
  from the offline test box, so this is what the matcher is exercised against;
  behaviour against the real store stays manually verifiable only.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dark Reader - Chrome Web Store</title>
  </head>
  <body>
    <header>
      <a href="/">Chrome Web Store</a>
      <button jsaction="click:openSearch">Search</button>
    </header>

    <div role="main" jscontroller="detailPage">
      <section
        itemtype="https://schema.org/WebApplication"
        data-item-id="eimadpbcbfnmbkopoojfekhnkhdbieeh"
      >
        <h1>Dark Reader</h1>
        <p>Dark mode for every website.</p>

        <div class="actions">
          <button
            role="button"
            aria-label="Add to Chrome"
            jsname="installButton"
            jsaction="click:beginInstall"
          >
            <span>Add to Chrome</span>
          </button>
          <button jsname="shareButton" jsaction="click:openShare">Share</button>
        </div>

        <div class="related">
          <h2>Related</h2>
          <button
            role="button"
            aria-label="Remove from Chrome"
            jsname="uninstallButton"
            jsaction="click:beginUninstall"
          >
            <span>Remove from Chrome</span>
          </button>
        </div>
      </section>
    </div>

    <footer>
      <button>Add to Chrome</button>
    </footer>
  </body>
</html>
